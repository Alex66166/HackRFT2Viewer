name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  real-iq-probe:
    name: Inspect real 546 MHz broadcast sample
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download externally recorded DVB-T2 signal
        run: |
          mkdir -p real-iq/raw
          curl -fSL --retry 2 --connect-timeout 15 --max-time 120 \
            'https://www.radioscanner.ru/files/download/file18613/t2.rar' -o real-iq/t2.rar
          sha256sum real-iq/t2.rar
          file real-iq/t2.rar
          test "$(stat -c%s real-iq/t2.rar)" -gt 1000000
      - name: Identify native IQ format, contents and extracted files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 7zip python3-numpy
          7z l -slt real-iq/t2.rar | head -150
          7z x -y -oreal-iq/raw real-iq/t2.rar
          test "$(du -sb real-iq/raw | cut -f1)" -lt 300000000
          python3 tests/probe_real_iq.py real-iq/raw
          python3 tests/convert_real_iq.py real-iq/raw/t2/_VV.CPX real-iq/Russia_546MHz_9.142857MSps.cs8
          file real-iq/Russia_546MHz_9.142857MSps.cs8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Real-2015-Russian-DVB-T2-IQ
          path: real-iq/
          retention-days: 7

  native-tests:
    name: Native receiver regressions (ASan and UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ ripgrep qtbase5-dev qtbase5-dev-tools libfftw3-dev libusb-1.0-0-dev gnuradio python3-scipy ffmpeg
      - name: Run receiver, FEC, transport and GUI tests
        env:
          QT_NATIVE: /usr
          SANITIZE: '1'
        run: bash build-tests-native.sh
      - name: Verify independent GNU Radio RF-to-TS interoperability
        env:
          QT_NATIVE: /usr
          SANITIZE: '1'
          NO_GUI: '1'
          TESTS: iq_replay_test
        run: |
          python3 tests/gnuradio_reference.py generate "$RUNNER_TEMP/gr-reference"
          bash build-tests-native.sh "$RUNNER_TEMP/gr-reference/input.cs8" "$RUNNER_TEMP/gr-output.ts"
          python3 tests/gnuradio_reference.py verify "$RUNNER_TEMP/gr-reference" "$RUNNER_TEMP/gr-output.ts"
          NO_GUI=0 SKIP_CORE=1 GUI_TEST=gui_iq_replay_test bash build-tests-native.sh "$RUNNER_TEMP/gr-reference/input.cs8" "$RUNNER_TEMP/gr-gui-output.ts"
          python3 tests/gnuradio_reference.py verify "$RUNNER_TEMP/gr-reference" "$RUNNER_TEMP/gr-gui-output.ts"
          cp "$RUNNER_TEMP/gr-gui-output.ts" "$RUNNER_TEMP/gr-reference/expected.ts"
      - name: Stress independent DVB-T2 RF-to-TS under echoes and carrier offset
        env:
          QT_NATIVE: /usr
          SANITIZE: '1'
          NO_GUI: '1'
          TESTS: iq_replay_test
        run: |
          python3 tests/gnuradio_reference.py generate "$RUNNER_TEMP/gr-echo" --frames 4 --snr 22 --echo-delay 48 --echo-gain 0.15 --cfo-hz 70
          bash build-tests-native.sh "$RUNNER_TEMP/gr-echo/input.cs8" "$RUNNER_TEMP/gr-echo-output.ts"
          python3 tests/gnuradio_reference.py verify "$RUNNER_TEMP/gr-echo" "$RUNNER_TEMP/gr-echo-output.ts"

      - name: Export actual Linux DVB-T2 I/Q replay binary for independent capture analysis
        uses: actions/upload-artifact@v7
        with:
          name: HackRFT2Viewer-Linux-IQ-Replay-ASAN
          path: build-native/iq_replay_test
          retention-days: 7
          if-no-files-found: error
      - name: Replay downloaded real DVB-T2 broadcast IQ through native demodulator
        env:
          QT_NATIVE: /usr
          SANITIZE: '1'
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/real-rf"
          curl -fSL --retry 2 --max-time 120 'https://www.radioscanner.ru/files/download/file18613/t2.rar' -o "$RUNNER_TEMP/real-rf/t2.rar"
          sudo apt-get install -y --no-install-recommends 7zip
          7z x -y -o"$RUNNER_TEMP/real-rf" "$RUNNER_TEMP/real-rf/t2.rar"
          python3 tests/convert_real_iq.py "$RUNNER_TEMP/real-rf/t2/_VV.CPX" "$RUNNER_TEMP/real-rf/real.cs8"
          timeout 45 build-native/iq_replay_test "$RUNNER_TEMP/real-rf/real.cs8" "$RUNNER_TEMP/real-rf/recovered.ts" 9142857.142857143 > "$RUNNER_TEMP/real-rf/replay.log" 2>&1
          code=$?
          tail -100 "$RUNNER_TEMP/real-rf/replay.log"
          if [ "$code" -eq 4 ]; then echo 'FAIL: unexpected real capture buffer drops'; exit 4; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          # 104 ms is not a complete long DVB-T2 frame, so no-TS is an
          # expected observation, NOT a successful playback validation.
          echo "Real 2015 capture replay exit=$code (3=no complete TS)."
      - name: Validate recovered real video and audio from GNU Radio DVB-T2 IQ
        env:
          QT_NATIVE: /usr
          SANITIZE: '1'
          TESTS: iq_replay_test
          NO_GUI: '1'
        run: |
          python3 tests/gnuradio_reference.py generate "$RUNNER_TEMP/gr-av" --frames 5 --snr 20 --av
          bash build-tests-native.sh "$RUNNER_TEMP/gr-av/input.cs8" "$RUNNER_TEMP/gr-av-cli.ts"
          python3 tests/gnuradio_reference.py verify "$RUNNER_TEMP/gr-av" "$RUNNER_TEMP/gr-av-cli.ts"
          EXPECTED_SERVICE=Service01 NO_GUI=0 SKIP_CORE=1 GUI_TEST=gui_iq_replay_test bash build-tests-native.sh "$RUNNER_TEMP/gr-av/input.cs8" "$RUNNER_TEMP/gr-av-gui.ts"
          python3 tests/gnuradio_reference.py verify "$RUNNER_TEMP/gr-av" "$RUNNER_TEMP/gr-av-gui.ts"
          cp "$RUNNER_TEMP/gr-av-gui.ts" "$RUNNER_TEMP/gr-av/expected.ts"
      - name: Save independent Windows AV receiver fixture
        uses: actions/upload-artifact@v7
        with:
          name: Independent-DVB-T2-Video-Audio-Fixture
          path: |
            ${{ runner.temp }}/gr-av/input.cs8
            ${{ runner.temp }}/gr-av/fixture.json
            ${{ runner.temp }}/gr-av/expected.ts
          retention-days: 7
          if-no-files-found: error

      - name: Save independent Windows receiver fixture
        uses: actions/upload-artifact@v7
        with:
          name: Independent-DVB-T2-Fixture
          path: |
            ${{ runner.temp }}/gr-reference/input.cs8
            ${{ runner.temp }}/gr-reference/fixture.json
            ${{ runner.temp }}/gr-reference/expected.ts
          retention-days: 7
          if-no-files-found: error

  source-archive:
    name: Full source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload full source archive
        uses: actions/upload-artifact@v7
        with:
          name: HackRFT2Viewer-Full-Source-1.4.2-RC3
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error

  build-windows:
    needs: native-tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MinGW-w64 and Qt 5
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-ntldd

      - name: Build release
        run: |
          set -euxo pipefail
          QMAKE="$(command -v qmake-qt5 || command -v qmake)"
          echo "Using qmake: $QMAKE"
          printf '#define HACKRFT2_GIT_COMMIT "%s"\n' "$GITHUB_SHA" > src/build_revision.h
          "$QMAKE" HackRFT2Viewer.pro CONFIG+=release
          /mingw64/bin/mingw32-make.exe -j2
          EXE=""
          for p in release/HackRFT2Viewer.exe HackRFT2Viewer.exe; do
            if [[ -f "$p" ]]; then EXE="$p"; break; fi
          done
          test -n "$EXE"
          mkdir -p build-portable/HackRFT2Viewer-Portable-1.4.2-RC3
          cp "$EXE" build-portable/HackRFT2Viewer-Portable-1.4.2-RC3/HackRFT2Viewer.exe
          "$QMAKE" HackRFT2Viewer.pro CONFIG+=release CONFIG+=gui_iq_test
          /mingw64/bin/mingw32-make.exe -j2
          cp release/GuiIqReplayTest.exe build-portable/HackRFT2Viewer-Portable-1.4.2-RC3/

      - name: Deploy Qt runtime
        run: |
          set -euxo pipefail
          DIST=build-portable/HackRFT2Viewer-Portable-1.4.2-RC3
          WINDEPLOYQT="$(command -v windeployqt-qt5 || command -v windeployqt)"
          echo "Using windeployqt: $WINDEPLOYQT"
          "$WINDEPLOYQT" --release --no-translations "$DIST/HackRFT2Viewer.exe"
          cp src/fftw3/libfftw3f-3.dll "$DIST/"
          cp src/third_party/libusb/libusb-1.0.dll "$DIST/"
          cp qt.conf "$DIST/"
          cp /mingw64/bin/libgcc_s_seh-1.dll "$DIST/" || true
          cp /mingw64/bin/libstdc++-6.dll "$DIST/" || true
          cp /mingw64/bin/libwinpthread-1.dll "$DIST/" || true

      - name: Collect all MinGW runtime DLL dependencies
        run: |
          set -euxo pipefail
          DIST=build-portable/HackRFT2Viewer-Portable-1.4.2-RC3
          MINGW_BIN_WIN="$(cygpath -w /mingw64/bin)"
          NTLDD=/mingw64/bin/ntldd.exe

          collect_deps() {
            local target="$1"
            local target_win
            target_win="$(cygpath -w "$target")"

            "$NTLDD" -R -D "$MINGW_BIN_WIN" "$target_win" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*[^=]+=>[[:space:]]+(.+\.dll)[[:space:]]+\(0x[0-9A-Fa-f]+\).*$/\1/p' \
              | while IFS= read -r dep_win; do
                  dep_unix="$(cygpath -u "$dep_win" 2>/dev/null || true)"
                  case "$dep_unix" in
                    /mingw64/bin/*.dll)
                      cp -n "$dep_unix" "$DIST/" || true
                      ;;
                  esac
                done
          }

          # Scan the EXE and every Qt/plugin DLL produced by windeployqt.
          # ntldd -R follows dependencies recursively, so this also brings in
          # harfbuzz, freetype, glib, png, brotli, pcre2 and other MinGW runtime DLLs.
          while IFS= read -r -d '' f; do
            collect_deps "$f"
          done < <(find "$DIST" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)

          echo "=== Bundled runtime DLLs ==="
          find "$DIST" -maxdepth 1 -type f -iname '*.dll' -printf '%f\n' | sort

          # Hard fail if the dependency that exposed the packaging problem is absent.
          test -f "$DIST/libharfbuzz-0.dll"

      - name: Add docs and licenses
        run: |
          set -euxo pipefail
          DIST=build-portable/HackRFT2Viewer-Portable-1.4.2-RC3
          for f in README-RU.md VALIDATION.md CHANGELOG.md DIAGNOSTIC-RUN-RU.txt THIRD-PARTY-NOTICES.md HACKRF-LICENSE.txt COPYING-GPL-3.0.txt; do
            [[ -f "$f" ]] && cp "$f" "$DIST/"
          done
          cp -r licenses "$DIST/licenses"

      - name: Download official VLC 3.0.23 x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # downloads.videolan.org serves the actual file directly. get.videolan.org may
          # return the HTML mirror-selection page to non-browser clients such as IWR.
          $url = 'https://downloads.videolan.org/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'vlc-3.0.23-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip

          $file = Get-Item $zip
          if ($file.Length -lt 70000000) {
              throw "VLC download is unexpectedly small ($($file.Length) bytes); expected the ~80 MB ZIP"
          }

          $expected = '992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1'
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "VLC SHA256 mismatch: $actual" }

          $tmp = Join-Path $env:RUNNER_TEMP 'vlc-extract'
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $src = Join-Path $tmp 'vlc-3.0.23'
          if (-not (Test-Path $src)) { throw "VLC directory not found after extraction: $src" }

          $dst = Join-Path $PWD 'build-portable/HackRFT2Viewer-Portable-1.4.2-RC3/vlc'
          Copy-Item -Recurse -Force $src $dst

      - name: Bundle OnAir 3.0.0 real-world DVB-T2 receiver and command line interface
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/adswill/OnAir/releases/download/v3.0.0/'
          $archiveName = 'OnAir-3.0.0-windows-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP $archiveName
          $sums = Join-Path $env:RUNNER_TEMP 'onair-sha256sums.txt'
          Invoke-WebRequest -Uri ($base + $archiveName) -OutFile $zip
          Invoke-WebRequest -Uri ($base + 'SHA256SUMS') -OutFile $sums
          $entry = Get-Content $sums | Where-Object { $_ -match [regex]::Escape($archiveName) } | Select-Object -First 1
          if (-not $entry -or -not ($entry -match '^([0-9A-Fa-f]{64})\s+\*?')) {
              throw "Cannot verify the OnAir release checksum: $entry"
          }
          $expected = $Matches[1].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "OnAir release checksum mismatch: $actual" }
          if ((Get-Item $zip).Length -lt 90000000) { throw 'OnAir archive size unexpectedly small' }
          $tmp = Join-Path $env:RUNNER_TEMP 'onair-extract'
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $src = Join-Path $tmp 'OnAir-3.0.0-windows-x64'
          if (-not (Test-Path (Join-Path $src 'onair-cli.exe'))) { throw 'OnAir CLI missing' }
          $dst = Join-Path $PWD 'build-portable/HackRFT2Viewer-Portable-1.4.2-RC3/OnAir'
          Copy-Item -Recurse -Force $src $dst
          if (-not (Test-Path (Join-Path $dst 'OnAir.exe'))) { throw 'OnAir GUI missing' }
          # Prove that the packaged CLI can start without a radio attached.
          Push-Location $dst
          try {
              & (Join-Path $dst 'onair-cli.exe') --version
              if ($LASTEXITCODE -ne 0) { throw "OnAir CLI --version failed with $LASTEXITCODE" }
          } finally { Pop-Location }
          Write-Host "OnAir 3.0.0 bundled and checked ($((Get-Item $zip).Length) archive bytes)"

      - name: Download independently verified RF fixture
        uses: actions/download-artifact@v8
        with:
          name: Independent-DVB-T2-Fixture
          path: windows-rf-fixture

      - name: Run packaged Windows GUI receiver and compare exact TS
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'build-portable/HackRFT2Viewer-Portable-1.4.2-RC3').Path
          $fixture = (Resolve-Path 'windows-rf-fixture').Path
          $output = Join-Path $fixture 'windows-output.ts'
          # Resolve libraries exclusively from the portable folder and Windows.
          # The build toolchain on PATH must not hide a missing runtime DLL.
          $env:PATH = "$dist;$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_OPENGL = 'software'
          $env:QT_PLUGIN_PATH = $dist
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $dist 'platforms'
          $exe = Join-Path $dist 'GuiIqReplayTest.exe'
          $arguments = '"{0}" "{1}"' -f (Join-Path $fixture 'input.cs8'), $output
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -NoNewWindow
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Windows GUI receiver timed out' }
          if ($process.ExitCode -ne 0) { throw "Windows GUI receiver failed: $($process.ExitCode)" }
          $expected = (Get-FileHash -Algorithm SHA256 (Join-Path $fixture 'expected.ts')).Hash
          $actual = (Get-FileHash -Algorithm SHA256 $output).Hash
          if ($actual -ne $expected) { throw "Windows TS differs from the independently verified source: $actual" }
          Write-Host "Windows GUI RF-to-TS PASS: $((Get-Item $output).Length) exact bytes, SHA256 $actual"
          # Keep the packaged GUI test binary for the following AV fixture

      - name: Download independent DVB-T2 video and audio fixture
        uses: actions/download-artifact@v8
        with:
          name: Independent-DVB-T2-Video-Audio-Fixture
          path: windows-av-fixture

      - name: Verify packaged Windows demodulator returns exact playable AV TS
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'build-portable/HackRFT2Viewer-Portable-1.4.2-RC3').Path
          $fixture = (Resolve-Path 'windows-av-fixture').Path
          $output = Join-Path $fixture 'windows-av-output.ts'
          $env:PATH = "$dist;$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_OPENGL = 'software'
          $env:QT_PLUGIN_PATH = $dist
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $dist 'platforms'
          $exe = Join-Path $dist 'HackRFT2Viewer.exe'
          # GuiIqReplayTest was removed by the preceding packaged gate: rebuild
          # not needed; save the test runner next to the portable application.
          $runner = Join-Path $dist 'GuiIqReplayTest.exe'
          if (-not (Test-Path $runner)) { throw 'Missing GUI test runner for AV fixture' }
          $env:EXPECTED_SERVICE = 'Service01'
          $arguments = '"{0}" "{1}"' -f (Join-Path $fixture 'input.cs8'), $output
          $process = Start-Process -FilePath $runner -ArgumentList $arguments -PassThru -NoNewWindow
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Windows AV GUI test timed out' }
          if ($process.ExitCode -ne 0) { throw "Windows AV GUI failed: $($process.ExitCode)" }
          $expected = (Get-FileHash -Algorithm SHA256 (Join-Path $fixture 'expected.ts')).Hash
          $actual = (Get-FileHash -Algorithm SHA256 $output).Hash
          if ($actual -ne $expected) { throw "Windows AV transport mismatch: $actual" }
          Write-Host "Windows exact video+audio transport PASS: $((Get-Item $output).Length) bytes"
          Remove-Item $runner

      - name: Package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $PWD 'build-portable'
          $dir = Join-Path $base 'HackRFT2Viewer-Portable-1.4.2-RC3'
          $zip = Join-Path $base 'HackRFT2Viewer-Portable-1.4.2-RC3.zip'
          Compress-Archive -Path $dir -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  HackRFT2Viewer-Portable-1.4.2-RC3.zip" | Set-Content -Encoding ascii (Join-Path $base 'SHA256-1.4.2-RC3.txt')
          Get-Item $zip | Format-List FullName,Length
          Get-Content (Join-Path $base 'SHA256-1.4.2-RC3.txt')

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: HackRFT2Viewer-Portable-1.4.2-RC3
          path: |
            build-portable/HackRFT2Viewer-Portable-1.4.2-RC3.zip
            build-portable/SHA256-1.4.2-RC3.txt
          if-no-files-found: error
